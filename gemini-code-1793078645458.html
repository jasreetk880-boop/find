<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFind - University Lost & Found Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .badge-lost { background-color: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5; }
    .badge-found { background-color: #D1FAE5; color: #059669; border: 1px solid #6EE7B7; }
    .badge-resolved { background-color: #F3F4F6; color: #4B5563; border: 1px solid #D1D5DB; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Navigation Bar -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-indigo-500 rounded-lg flex items-center justify-center text-white shadow">
          <i class="fa-solid fa-magnifying-glass-location text-xl"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight">Campus<span class="text-indigo-400">Find</span></span>
          <span class="hidden sm:inline-block ml-2 text-xs bg-indigo-800 text-indigo-200 px-2 py-0.5 rounded">University Portal</span>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="openModal('lost')" class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow-sm flex items-center space-x-1.5">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Report Lost</span>
        </button>
        <button onclick="openModal('found')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow-sm flex items-center space-x-1.5">
          <i class="fa-solid fa-hand-holding-hand"></i>
          <span>Report Found</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- KPI / Statistics Cards -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Reports</p>
          <p id="totalCount" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-database"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-rose-500 uppercase tracking-wider">Lost Items</p>
          <p id="lostCount" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-box-open"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Found Items</p>
          <p id="foundCount" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-bullseye"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Resolved</p>
          <p id="resolvedCount" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>
    </section>

    <!-- Filters & Search Toolbar -->
    <section class="bg-white p-4 sm:p-5 rounded-
